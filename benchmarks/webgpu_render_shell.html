<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GPU WebGPU Render Benchmark</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #070b12;
        color: #f2f4f8;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 48px;
        place-items: center;
      }

      main {
        width: min(720px, 100%);
      }

      #status {
        color: #ff7a1a;
      }

      #status[data-failed="true"] {
        color: #ff5d68;
      }

      #results {
        padding: 24px;
        border: 1px solid #263041;
        border-radius: 14px;
        background: #0b111d;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="status">GPU: loading benchmark</p>
      <pre id="results">Waiting for warm samples…</pre>
    </main>
    {{{ SCRIPT }}}
  </body>
</html>
